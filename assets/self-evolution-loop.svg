<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Solid light background so the diagram stays readable in dark mode too -->
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/>
    </marker>
  </defs>

  <!-- Agent State -->
  <rect x="60" y="100" width="260" height="150" rx="16" fill="#dbeafe" stroke="#1e1e1e" stroke-width="2"/>
  <text x="190" y="163" font-size="28" font-weight="600" text-anchor="middle" fill="#1e1e1e">Agent State</text>
  <text x="190" y="196" font-size="18" text-anchor="middle" fill="#444">workspace · context · LLM</text>

  <!-- External Environment -->
  <rect x="680" y="100" width="260" height="150" rx="16" fill="#dcfce7" stroke="#1e1e1e" stroke-width="2"/>
  <text x="810" y="170" font-size="28" font-weight="600" text-anchor="middle" fill="#1e1e1e">Environment</text>

  <!-- actions & outcomes -->
  <line x1="320" y1="150" x2="672" y2="150" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="496" y="132" font-size="22" text-anchor="middle" fill="#1e1e1e">actions &amp; outcomes</text>

  <!-- feedback -->
  <line x1="680" y1="220" x2="328" y2="220" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="260" font-size="22" text-anchor="middle" fill="#1e1e1e">feedback → persistent updates</text>

  <!-- Harness -->
  <rect x="380" y="330" width="240" height="90" rx="16" fill="#fef3c7" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="500" y="367" font-size="22" font-weight="600" text-anchor="middle" fill="#1e1e1e">Harness</text>
  <text x="500" y="395" font-size="18" text-anchor="middle" fill="#444">(orchestrates the loop)</text>
</svg>
